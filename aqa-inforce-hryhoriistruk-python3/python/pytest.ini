[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --reruns 2
    --reruns-delay 1
markers =
    ui: UI tests
    api: API tests
    smoke: Critical path tests (fast sanity run)
    regression: Full regression suite
    slow: Slow running tests
xfail_strict = true